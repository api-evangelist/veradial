apis:
- name: VeraDial MCP Server
  aid: veradial:mcp
  description: >-
    Remote, read-only Model Context Protocol server (Streamable HTTP) that lets a customer's own AI assistant
    - Claude, ChatGPT, Codex or any MCP client - read that customer's VeraDial account - calls with AI
    screening summaries, call and voicemail transcripts, SMS threads, contacts, phone lines, receptionist
    configuration, plan status and remaining minutes. OAuth 2.1 with the customer's VeraDial login; no
    API keys.
  humanURL: https://veradial.com/for-agents
  baseURL: https://api.veradial.com/mcp
  tags:
  - MCP
  - AI Agents
  - Authentication
  - Read Only
  tags_raw:
  - MCP
  - AI Agents
  - OAuth
  - Read Only
