name: VeraDial
aid: veradial
description: VeraDial is an AI receptionist and business phone app for small businesses in the United States and
  Canada, built by Graham Thomson in Toronto. It gives a business a dedicated US or Canadian number with Vera, an
  AI receptionist that answers calls and texts 24/7, screens callers, takes messages, books appointments and places
  outbound AI calls. Developers and agents reach an account three ways - a read-only remote MCP server at api.veradial.com/mcp
  secured with OAuth 2.1, a Zapier REST Hooks integration API authenticated with vdk_ API keys, and signed HMAC
  event webhooks for Make, n8n or your own service.
