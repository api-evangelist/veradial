  title: ZAPIER_SUBSCRIPTION_LIMIT_REACHED
  type: ZAPIER_SUBSCRIPTION_LIMIT_REACHED
  description: A VeraDial account may have up to 25 active Zapier hook subscriptions.
  remediation: Unsubscribe unused hooks with DELETE /hooks/:id.
- status: 400
  title: Unsafe target URL
  type: null
  description: Subscription URLs must be public HTTPS endpoints and pass VeraDial's server-side request-forgery checks.
  remediation: Use a final, publicly reachable HTTPS URL.
- status: 410
  title: Gone (returned BY the receiver)
  type: null
  description: A 410 Gone from the Zap target means the Zap no longer accepts the hook; VeraDial deactivates the subscription and does not retry.
  remediation: Resubscribe with POST /hooks.
